{% extends "base.html" %}
{% block content %}

    <h2>Modules</h2>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col">Code</th>
                <th scope="col">Name</th>
            </tr>
        </thead>
        <tbody>
            {% for module in modules %}
            <tr>
                <th scope="row">{{ module.code }}</th>
                <td>{{ module.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
